<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - Download & Enjoy</title>
    <!-- Muna amfani da Tailwind CSS don tsara shi cikin sauƙi -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Launuka na musamman don su yi daidai da hoton */
        .bg-brand-pink {
            background-color: #f41b75;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between items-center font-sans antialiased">

    <!-- Wurin Sama (Zaka iya saka Logo ko barin shi a sarari) -->
    <div class="h-20"></div>

    <!-- Tsakiyar Shafi: Hoton Play Button -->
    <div class="flex flex-col items-center justify-center flex-grow w-full max-w-md px-6">
        <div class="w-72 h-72 bg-brand-pink rounded-[3rem] flex items-center justify-center shadow-lg transition-transform hover:scale-105 duration-300 cursor-pointer">
            <!-- Alamar Play (Triangle fari) -->
            <svg class="w-32 h-32 text-white ml-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>
    </div>

    <!-- Ƙanshan Shafi: Sunan App da Bayani -->
    <div class="w-full text-center pb-16 px-6">
        <h1 class="text-4xl font-semibold text-gray-900 tracking-tight mb-2">
            Stream
        </h1>
        <p class="text-xl text-gray-600 font-medium tracking-wide">
            Download <span class="mx-1 text-gray-400 font-bold">·</span> Enjoy
        </p>
    </div>

    <!-- Tsarin Wurin Ciko na Wayoyi (Home Indicator Bar a ƙasa) -->
    <div class="w-full flex justify-center pb-3">
        <div class="w-36 h-1 bg-black rounded-full opacity-80"></div>
    </div>

</body>
</html>
