<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidStream</title>
<style>
/* ================= SPLASH — KOMAI A CIKI ================= */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}

/* Pink background kamar hotonka */
body{background:linear-gradient(160deg,#f63081,#df1163);overflow:hidden;
  font-family:'Segoe UI',sans-serif;display:grid;place-items:center}

.splash{position:fixed;inset:0;display:grid;place-items:center;
  transition:opacity .45s,visibility .45s}
.splash.gone{opacity:0;visibility:hidden}

/* ---- APP ICON (pink rounded square + white play) ---- */
.app-icon{width:min(58vw,300px);aspect-ratio:1;border-radius:24%;
  background:radial-gradient(120% 120% at 30% 20%,#f75795,#ee2174 60%,#e6186a);
  display:grid;place-items:center;
  box-shadow:0 30px 80px rgba(0,0,0,.20),inset 0 2px 18px rgba(255,255,255,.18);
  animation:zoomIn 3s ease-in-out}
.app-icon svg{width:52%;height:52%;margin-left:6%}

@keyframes zoomIn{0%{transform:scale(1.08);opacity:.6}50%{transform:scale(1)}100%{transform:scale(1.02)}}

/* ---- Sunan app a kasa ---- */
.brand{position:fixed;bottom:calc(48px + env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;color:#fff;
  font-size:30px;font-weight:800;letter-spacing:-.5px;
  text-shadow:0 2px 14px rgba(0,0,0,.18);
  animation:riseUp .8s .4s ease both}
.brand span{font-weight:300;opacity:.92}
@keyframes riseUp{from{transform:translateY(20px);opacity:0}}
</style>
</head>
<body>

<!-- SPLASH: pink logo + play, bayan daƙiƙa 3 → welcome.html -->
<div class="splash" id="splash">

  <div class="app-icon">
    <!-- LOGO: white play triangle (SVG a ciki, ba file daban ba) -->
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 28 L98 60 L40 92 Z" fill="#ffffff"/>
    </svg>
  </div>

  <div class="brand"><b>Vid</b><span>Stream</span></div>

</div>

<script>
/* ================================================
   VIDSTREAM — SPLASH (index.html — komai a ciki)
   Bayan daƙiƙa 3 → welcome.html
================================================ */
const NEXT_PAGE = 'welcome.html';
const WAIT = 3000;   // ⏱️ daƙiƙa 3

setTimeout(()=>{
  document.getElementById('splash').classList.add('gone');
  setTimeout(()=>{ window.location.href = NEXT_PAGE; }, 450);
}, WAIT);
</script>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {
      scope: '/'
    })
    .then(registration => {
      console.log(
        'VidStream Service Worker registered:',
        registration.scope
      );
    })
    .catch(error => {
      console.error(
        'Service Worker registration failed:',
        error
      );
    });
  });
}
  </script>
</body>
</html>
