<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidStream — Watch & Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --bg2:#181818; --bg3:#232323; --text:#f1f1f1; --text2:#a5a5a5;
  --border:#2b2b2b; --accent:#ff3d5a; --accent2:#7c3aed; --chip:#272727; --hover:#2e2e2e;
  --ok:#2ed573; --warn:#ffa502; --shadow:0 12px 32px rgba(0,0,0,.45);
}
body.light{
  --bg:#f9f9f9; --bg2:#ffffff; --bg3:#f0f0f0; --text:#0f0f0f; --text2:#606060;
  --border:#e0e0e0; --chip:#ececec; --hover:#e4e4e4; --shadow:0 12px 32px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:var(--hover) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--hover);border-radius:8px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
.ic{display:inline-flex;vertical-align:middle;flex-shrink:0}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:60px;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.5px;cursor:pointer;user-select:none}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{color:var(--text);font-weight:300}
.search-wrap{flex:1;max-width:620px;margin:0 auto;position:relative}
.search-bar{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);
  border-radius:24px;overflow:hidden;transition:border .2s}
.search-bar:focus-within{border-color:var(--accent)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);
  padding:10px 18px;font-size:15px;font-family:inherit}
.search-btn{padding:9px 20px;border-left:1px solid var(--border);color:var(--text2)}
.search-btn:hover{color:var(--text)}
.suggest{position:absolute;top:110%;left:0;right:0;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none}
.suggest.open{display:block}
.suggest div{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;color:var(--text2)}
.suggest div:hover,.suggest div.hot{background:var(--hover);color:var(--text)}
.hd-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .2s}
.icon-btn:hover{background:var(--hover)}
.avatar-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#00c6ff,#0072ff);
  display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}

/* ---------- LAYOUT ---------- */
.layout{display:flex}
.sidebar{width:225px;position:sticky;top:60px;height:calc(100vh - 60px);padding:12px 10px;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:18px;padding:11px 16px;border-radius:12px;cursor:pointer;
  color:var(--text);font-size:14.5px;transition:background .15s;margin-bottom:2px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--bg3);font-weight:600}
.nav-item.active .ic{color:var(--accent)}
.nav-sep{border-top:1px solid var(--border);margin:10px 6px}
.nav-label{font-size:11px;letter-spacing:1.4px;color:var(--text2);padding:6px 16px;font-weight:600}
main{flex:1;min-width:0;padding:22px 26px 80px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
.overlay.show{display:block}

/* ---------- CHIPS ---------- */
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:10px;background:var(--chip);font-size:13.5px;white-space:nowrap;
  color:var(--text);border:1px solid transparent;transition:all .15s;font-weight:500}
.chip:hover{background:var(--hover)}
.chip.active{background:var(--text);color:var(--bg);font-weight:600}

/* ---------- VIDEO GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px 18px}
.card{cursor:pointer;animation:rise .4s ease both}
.card:hover .thumb img{transform:scale(1.05)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg3)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;
  font-weight:600;padding:2px 7px;border-radius:6px}
.quick-dl{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.72);
  color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(-6px);transition:all .25s;backdrop-filter:blur(4px)}
.quick-dl:hover{background:var(--accent)}
.card:hover .quick-dl{opacity:1;transform:translateY(0)}
.card-info{display:flex;gap:12px;padding:12px 4px 0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;
  color:#fff;flex-shrink:0;background:linear-gradient(135deg,hsl(var(--h,0) 70% 50%),hsl(calc(var(--h,0) + 50) 70% 42%))}
.card-title{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.card-sub{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.verified{color:var(--text2)}

/* ---------- SHELVES ---------- */
.shelf-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;margin:26px 0 14px}
.shelf-title .ic{color:var(--accent)}
.shorts-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.shorts-row::-webkit-scrollbar{display:none}
.short-card{flex:0 0 165px;cursor:pointer}
.short-thumb{position:relative;aspect-ratio:9/14;border-radius:16px;overflow:hidden;background:var(--bg3)}
.short-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.short-card:hover .short-thumb img{transform:scale(1.06)}
.short-play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 40%,rgba(0,0,0,.7))}
.short-title{font-size:13.5px;font-weight:600;margin-top:9px;line-height:1.3;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.short-views{font-size:12px;color:var(--text2);margin-top:3px}

/* ---------- TRENDING ---------- */
.trend-row{display:flex;gap:16px;padding:14px;border-radius:16px;cursor:pointer;transition:background .2s;align-items:flex-start}
.trend-row:hover{background:var(--bg2)}
.rank{font-size:34px;font-weight:800;width:46px;text-align:center;line-height:1;padding-top:6px;
  -webkit-text-stroke:1px var(--accent);color:transparent}
.trend-thumb{width:min(360px,32vw);aspect-ratio:16/9;border-radius:12px;overflow:hidden;flex-shrink:0;position:relative;background:var(--bg3)}
.trend-thumb img{width:100%;height:100%;object-fit:cover}

/* ---------- WATCH PAGE ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px}
.player{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;user-select:none}
.player video{width:100%;height:100%;display:block}
.big-play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.35));transition:opacity .25s}
.big-play.hide{opacity:0;pointer-events:none}
.big-play span{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;box-shadow:0 10px 40px rgba(255,61,90,.5);transition:transform .2s}
.big-play:hover span{transform:scale(1.1)}
.p-controls{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .25s;color:#fff}
.p-controls.hide{opacity:0;pointer-events:none}
.p-progress{height:5px;background:rgba(255,255,255,.25);border-radius:4px;cursor:pointer;position:relative;margin-bottom:6px}
.p-progress:hover{height:7px}
.p-buffered,.p-played{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.p-buffered{background:rgba(255,255,255,.35);width:0}
.p-played{background:var(--accent);width:0}
.p-played::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,61,90,.3);opacity:0;transition:opacity .2s}
.p-progress:hover .p-played::after{opacity:1}
.p-row{display:flex;align-items:center;gap:6px}
.p-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .15s}
.p-btn:hover{background:rgba(255,255,255,.15)}
.p-time{font-size:13px;color:#ddd;margin:0 8px;font-variant-numeric:tabular-nums}
.p-spacer{flex:1}
.vol{width:0;overflow:hidden;transition:width .25s;display:flex;align-items:center}
.vol.open{width:90px}
.vol input{accent-color:var(--accent);width:80px;cursor:pointer}
.speed-menu{position:absolute;right:12px;bottom:64px;background:rgba(20,20,20,.95);border-radius:12px;
  padding:8px;display:none;flex-direction:column;gap:2px;border:1px solid #333}
.speed-menu.open{display:flex}
.speed-menu button{padding:8px 22px;border-radius:8px;color:#fff;font-size:13.5px;text-align:center}
.speed-menu button:hover{background:#333}
.speed-menu button.on{color:var(--accent);font-weight:700}

.w-title{font-size:21px;font-weight:700;line-height:1.3;margin:16px 0 10px}
.w-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.w-channel{display:flex;align-items:center;gap:12px;margin-right:auto}
.w-channel .avatar{width:42px;height:42px;font-size:18px}
.w-cname{font-weight:600;font-size:15px}
.w-csubs{font-size:12.5px;color:var(--text2)}
.pill{display:flex;align-items:center;gap:8px;padding:9px 17px;border-radius:24px;background:var(--chip);
  font-size:14px;font-weight:600;transition:background .15s}
.pill:hover{background:var(--hover)}
.pill.liked{background:var(--accent);color:#fff}
.pill.subscribed{background:var(--bg3);color:var(--text2)}
.pill.dl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.pill.dl:hover{filter:brightness(1.12)}
.w-desc{background:var(--bg2);border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.55;
  color:var(--text);cursor:pointer;margin-bottom:24px}
.w-desc .d-meta{color:var(--text2);font-weight:600;margin-bottom:6px}
.w-desc p{color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-desc.open p{display:block;color:var(--text)}
.w-desc .more{color:var(--text);font-weight:600;margin-top:6px;display:inline-block}

/* comments */
.c-title{font-size:18px;font-weight:700;margin-bottom:18px}
.c-add{display:flex;gap:14px;margin-bottom:26px}
.c-add input{flex:1;background:none;border:none;border-bottom:1px solid var(--border);outline:none;
  color:var(--text);padding:8px 2px;font-size:14px;font-family:inherit}
.c-add input:focus{border-color:var(--text)}
.c-send{color:var(--accent);font-weight:700;font-size:14px;padding:8px 14px;border-radius:20px}
.c-send:hover{background:var(--bg3)}
.comment{display:flex;gap:14px;margin-bottom:22px;animation:rise .3s ease both}
.c-head{font-size:13px;font-weight:600;margin-bottom:3px}
.c-head span{color:var(--text2);font-weight:400;margin-left:8px}
.c-text{font-size:14px;line-height:1.5;color:var(--text)}
.c-like{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--text2);font-size:12.5px;cursor:pointer}
.c-like.on{color:var(--accent)}
/* related */
.rel-card{display:flex;gap:10px;cursor:pointer;padding:6px;border-radius:12px;transition:background .15s;margin-bottom:4px}
.rel-card:hover{background:var(--bg2)}
.rel-thumb{width:168px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;background:var(--bg3)}
.rel-thumb img{width:100%;height:100%;object-fit:cover}
.rel-title{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.rel-sub{font-size:12px;color:var(--text2)}
.rel-head{display:flex;justify-content:space-between;align-items:center;position:relative}

/* ---------- DOWNLOADS ---------- */
.dl-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.dl-head h2{font-size:26px;font-weight:800;display:flex;align-items:center;gap:12px}
.dl-head h2 .ic{color:var(--accent)}
.dl-stats{color:var(--text2);font-size:14px;margin-bottom:20px}
.dl-stats b{color:var(--text)}
.dl-note{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px dashed var(--border);
  border-radius:12px;padding:12px 16px;font-size:13px;color:var(--text2);margin-bottom:22px}
.dl-section{font-size:13px;font-weight:700;letter-spacing:1.2px;color:var(--text2);margin:24px 0 12px;text-transform:uppercase}
.dl-card{display:flex;gap:16px;align-items:center;background:var(--bg2);border-radius:16px;padding:14px;
  margin-bottom:12px;animation:rise .3s ease both;border:1px solid var(--border)}
.dl-thumb{width:120px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative;background:var(--bg3)}
.dl-thumb img{width:100%;height:100%;object-fit:cover}
.fmt-badge{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;letter-spacing:.5px}
.dl-body{flex:1;min-width:0}
.dl-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-meta{font-size:12.5px;color:var(--text2);margin:4px 0 8px}
.dl-bar{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.dl-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;
  transition:width .6s linear;position:relative}
.dl-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.dl-pct{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:6px}
.dl-actions{display:flex;gap:6px;flex-shrink:0}
.dl-actions .icon-btn{background:var(--bg3)}
.dl-actions .icon-btn:hover{background:var(--hover)}
.dl-actions .icon-btn.res{color:var(--ok)}
.dl-actions .icon-btn.del:hover{background:var(--accent);color:#fff}
.dl-actions .icon-btn.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.empty{text-align:center;padding:70px 20px;color:var(--text2)}
.empty .ic{opacity:.5;margin-bottom:16px}
.empty h3{color:var(--text);font-size:19px;margin-bottom:8px}

/* ---------- MODAL ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;
  display:none;place-items:center;padding:20px}
.modal-ov.show{display:grid}
.modal{width:min(480px,100%);background:var(--bg2);border-radius:20px;overflow:hidden;border:1px solid var(--border);
  animation:pop .3s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pop{from{transform:scale(.92) translateY(16px);opacity:0}}
.m-head{display:flex;gap:14px;padding:18px;border-bottom:1px solid var(--border);align-items:center}
.m-head img{width:110px;aspect-ratio:16/9;border-radius:10px;object-fit:cover}
.m-head h3{font-size:14.5px;line-height:1.35;margin-bottom:5px}
.m-head p{font-size:12.5px;color:var(--text2)}
.m-close{margin-left:auto}
.m-tabs{display:flex;padding:14px 18px 0;gap:8px}
.m-tab{flex:1;padding:11px;border-radius:12px;background:var(--bg3);font-weight:600;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text2)}
.m-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.m-list{padding:14px 18px 20px;max-height:320px;overflow-y:auto}
.m-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;transition:background .15s}
.m-row:hover{background:var(--bg3)}
.m-q{font-weight:700;font-size:15px}
.m-note{font-size:11px;color:var(--accent);font-weight:700;margin-left:6px}
.m-size{font-size:12.5px;color:var(--text2);margin-top:2px}
.m-dl{margin-left:auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--bg3);transition:all .15s}
.m-dl:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* ---------- TOAST ---------- */
.toasts{position:fixed;bottom:26px;right:26px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:13px 18px;box-shadow:var(--shadow);font-size:14px;font-weight:500;
  animation:tin .35s cubic-bezier(.2,1.2,.4,1) both;max-width:340px}
.toast .ic{color:var(--accent)}
.toast.ok .ic{color:var(--ok)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.toast.out{animation:tout .3s ease both}
@keyframes tout{to{transform:translateX(40px);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.page-title{font-size:26px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.page-title .ic{color:var(--accent)}

/* ---------- RESPONSIVE ---------- */
.bottom-nav{display:none}
@media(max-width:1150px){.watch{grid-template-columns:1fr}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:60px;z-index:56;background:var(--bg);transform:translateX(-100%);
    transition:transform .25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  main{padding:16px 14px 96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg2);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav .nav-item{flex:1;flex-direction:column;gap:4px;align-items:center;font-size:10.5px;
    padding:7px 2px;border-radius:12px;color:var(--text2)}
  .bottom-nav .nav-item.active{color:var(--text);background:none}
  .bottom-nav .nav-item.active .ic{color:var(--accent)}
  .trend-thumb{width:44vw}
  .rank{display:none}
  .search-wrap{position:static}
  .logo span{display:none}
}
@media(max-width:600px){
  .hd-actions .theme-btn{display:none}
  .dl-card{flex-wrap:wrap}
  .trend-thumb{width:100%}
  .trend-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="hamburger"></button>
  <div class="logo" onclick="go('home')">
    <div class="logo-mark" id="logoMark"></div>
    <span><b>Vid</b>Stream</span>
  </div>
  <div class="search-wrap">
    <div class="search-bar">
      <input id="searchInput" placeholder="Search videos, channels…" autocomplete="off">
      <button class="search-btn" id="searchBtn"></button>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="hd-actions">
    <button class="icon-btn theme-btn" id="themeBtn" title="Toggle theme"></button>
    <div class="avatar-me">V</div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"><div style="padding:40px;text-align:center">Loading videos…</div></main>

function mapSupabaseVideo(row, channelName, categoryName){
  const published = row.published_at ? new Date(row.published_at) : null;
  const now = new Date();
  let d='Recently';
  if(published && !Number.isNaN(published.getTime())){
    const days=Math.max(0,Math.floor((now-published)/86400000));
    d=days<1?'today':days===1?'1 day ago':days<7?`${days} days ago`:days<30?`${Math.floor(days/7)} weeks ago`:days<365?`${Math.floor(days/30)} months ago`:`${Math.floor(days/365)} years ago`;
  }
  return {
    id:row.youtube_video_id, dbId:row.id, youtubeId:row.youtube_video_id,
    t:row.title||'Untitled video', ch:channelName||'Unknown channel', vf:1,
    v:0, d, dur:row.duration_seconds?fmtTime(row.duration_seconds):'—',
    cat:categoryName||'All', src:'',
    th:row.thumbnail_url||`https://i.ytimg.com/vi/${row.youtube_video_id}/hqdefault.jpg`,
    youtubeUrl:row.youtube_url||`https://www.youtube.com/watch?v=${row.youtube_video_id}`,
    publishedAt:row.published_at||null
  };
}

async function loadSupabaseVideos(){
  try{
    const {data:rows,error}=await supabaseClient.from('videos')
      .select('id,youtube_video_id,channel_id,category_id,title,description,thumbnail_url,youtube_url,published_at,duration_seconds,is_active')
      .eq('is_active',true).order('published_at',{ascending:false});
    if(error) throw error;
    const channelIds=[...new Set((rows||[]).map(r=>r.channel_id).filter(Boolean))];
    const categoryIds=[...new Set((rows||[]).map(r=>r.category_id).filter(Boolean))];
    const channelMap={}, categoryMap={};
    if(channelIds.length){
      const {data,error}=await supabaseClient.from('channels').select('id,name').in('id',channelIds);
      if(error) throw error; (data||[]).forEach(x=>channelMap[x.id]=x.name);
    }
    if(categoryIds.length){
      const {data,error}=await supabaseClient.from('categories').select('id,name').in('id',categoryIds);
      if(error) throw error; (data||[]).forEach(x=>categoryMap[x.id]=x.name);
    }
    VIDEOS.length=0;
    (rows||[]).forEach(row=>VIDEOS.push(mapSupabaseVideo(row,channelMap[row.channel_id],categoryMap[row.category_id])));
    const cats=[...new Set(VIDEOS.map(v=>v.cat).filter(Boolean))];
    CATS.length=0; CATS.push('All',...cats.filter(x=>x!=='All'),'Trending');
    render();
    toast(`${VIDEOS.length} videos loaded`,'check',true);
  }catch(err){
    console.error('Supabase load failed:',err);
    render();
    toast('Supabase videos could not be loaded','info');
  }
}

    return html + `<div class="empty">${ic('download',56)}<h3>No downloads yet</h3>
      <p>Tap the download button on any video to save it for offline viewing.</p></div>`;
  }
  const row = d => {
    const v = byId(d.vid) || {th:''};
    const pct = Math.min(100, d.rec/d.size*100);

      ? `<button class="icon-btn go" onclick="openWatch('${d.vid}')" title="Play">${ic('play',18,true)}</button>
         <button class="icon-btn del" onclick="removeDl('${d.id}')" title="Delete">${ic('trash',18)}</button>`

         <button class="icon-btn del" onclick="removeDl('${d.id}')" title="Cancel">${ic('close',18)}</button>`
      : `<button class="icon-btn res" onclick="resumeDl('${d.id}')" title="Resume">${ic('playC',20)}</button>
         <button class="icon-btn del" onclick="removeDl('${d.id}')" title="Cancel">${ic('close',18)}</button>`;
    return `<div class="dl-card">
      <div class="dl-thumb"><img src="${v.th}" loading="lazy"><span class="fmt-badge">${isAud?'MP3':d.q}</span></div>
      <div class="dl-body">
        <div class="dl-title">${esc(d.title)}</div>
        <div class="dl-meta">${esc(d.ch)} · ${d.dur} · ${fmtSize(d.rec)} / ${fmtSize(d.size)}
          ${d.status==='downloading'?` · <b style="color:var(--ok)">${d.sp.toFixed(1)} MB/s</b>`:''}
          ${d.status==='paused'?' · <b style="color:var(--warn)">Paused</b>':''}

  };

  if(done.length) html += `<div class="dl-section">Completed</div>` + done.map(row).join('');
  return html;
}

function refreshDlView(){ if(state.page==='downloads') render(); renderNav(); }
function startEngine(){
  if(engine) return;
  engine = setInterval(()=>{
    let any = false;
    state.downloads.forEach(d=>{
      if(d.status!=='downloading') return;
      any = true;
      d.rec += d.sp * (0.6 + Math.random()*0.9);
      if(d.rec >= d.size){ d.rec=d.size; d.status='done'; toast(`Downloaded: ${d.title.slice(0,32)}…`,'check',true); }
    });
    save('downloads', state.downloads);
    if(!any){ clearInterval(engine); engine=null; }
    if(state.page==='downloads') render();
  }, 1000);
}
  /* ---------- WATCH PAGE ---------- */
function commentsFor(id){
  const seed = [...id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const n = 4 + seed % 3;
  const list = [];
  for(let i=0;i<n;i++){
    const p = COMMENT_POOL[(seed+i*5)%COMMENT_POOL.length];
    const ch = VIDEOS[(seed+i)%VIDEOS.length].ch;
    list.push({user:ch, text:p, when:`${1+((seed+i)%13)} ${['hours','days','weeks'][i%3]} ago`, likes:(seed*i*137)%4200, key:id+':'+i});
  }
  const mine = (state.comments[id]||[]).map((c,i)=>({user:'You',text:c.text,when:'just now',likes:0,key:id+':me'+i}));
  return [...mine,...list];
}

        <p>${esc(v.t)} — presented by ${esc(v.ch)}. Royalty-free sample footage courtesy of the Blender Foundation open movie project.
        Watch in up to 1080p, download for offline playback in MP4 or MP3, and adjust playback speed.</p>

}
function commentHTML(c){
  const on = state.cLikes.includes(c.key);
  return `<div class="comment">
    <div class="avatar" style="--h:${hue(c.user)};width:36px;height:36px;font-size:15px">${c.user==='You'?'V':c.user[0]}</div>
    <div style="min-width:0;flex:1">
      <div class="c-head">@${esc(c.user.toLowerCase().replace(/\s/g,''))}<span>${c.when}</span></div>
      <div class="c-text">${esc(c.text)}</div>
      <div class="c-like ${on?'on':''}" onclick="likeComment('${c.key}',this)">${ic('like',15)} <span>${fmtN(c.likes+(on?1:0))}</span></div>
    </div></div>`;
}
function likeComment(key, el){
  const i = state.cLikes.indexOf(key);
  if(i>=0) state.cLikes.splice(i,1); else state.cLikes.push(key);
  save('cLikes', state.cLikes);
  const span = el.querySelector('span');
  let n = parseInt(span.textContent.replace(/[KM]/g, m=>m==='K'?'000':'00000'))||0;
  span.textContent = fmtN(Math.max(0,n+(i>=0?-1:1)));
  el.classList.toggle('on');
}
function postComment(id){
  const inp = $('#cInput');
  const text = inp.value.trim();
  if(!text) return;
  state.comments[id] = [{text, at:Date.now()}, ...(state.comments[id]||[])];
  save('comments', state.comments);
  inp.value='';
  $('#cList').insertAdjacentHTML('afterbegin', commentHTML({user:'You',text,when:'just now',likes:0,key:id+':me0'}));
  toast('Comment posted','check',true);
}
function toggleSub(ch){
  const i = state.subs.indexOf(ch);
  if(i>=0){ state.subs.splice(i,1); toast('Unsubscribed from '+ch,'close'); }
  else { state.subs.push(ch); toast('Subscribed to '+ch+' 🔔','check',true); }
  save('subs', state.subs); render();
}
function toggleLike(id){
  const i = state.liked.indexOf(id);
  if(i>=0){ state.liked.splice(i,1); toast('Removed from liked videos','heart'); }
  else { state.liked.push(id); toast('Added to liked videos','heart',true); }
  save('liked', state.liked); render();
}
function shareVideo(id){
  const url = location.href.split('#')[0] + '#watch=' + id;
  (navigator.clipboard?.writeText(url) || Promise.reject()).then(
    ()=>toast('Link copied to clipboard','share',true),
    ()=>toast('Share link ready','share'));
}

let hideTimer=null, seeking=false;

  const frame=$('#ytFrame');

  // Supabase videos are YouTube-hosted. The official embed supplies playback controls.
  const ctrls=$('#pControls');

/* ---------- DOWNLOAD MODAL ---------- */
function estSize(dur, fmt, q){
  const sec = parseDur(dur);
  if(fmt==='audio') return sec * (q==='320 kbps' ? 0.04 : 0.016);
  const mbps = {'1080p':5,'720p':2.5,'480p':1.2,'360p':0.7}[q];
  return Math.max(2, sec * mbps * 0.125);
}
function openModal(vid){
  modalVideo = byId(vid); dlTab='video';
  drawModal();
  $('#modalOv').classList.add('show');
}
function drawModal(){
  const v = modalVideo; if(!v) return;
  const vidQ = [['1080p','Full HD'],['720p','HD'],['480p',''],['360p','']];
  const audQ = [['320 kbps','Best'],['128 kbps','']];
  const qs = dlTab==='video' ? vidQ : audQ;
  $('#modalBox').innerHTML = `
    <div class="m-head">
      <img src="${v.th}" alt="">
      <div><h3>${esc(v.t)}</h3><p>${esc(v.ch)} · ${v.dur} · ${fmtN(v.v)} views</p></div>
      <button class="icon-btn m-close" onclick="closeModal()">${ic('close',20)}</button>
    </div>
    <div class="m-tabs">
      <button class="m-tab ${dlTab==='video'?'active':''}" onclick="dlTab='video';drawModal()">${ic('film',17)} Video MP4</button>
      <button class="m-tab ${dlTab==='audio'?'active':''}" onclick="dlTab='audio';drawModal()">${ic('music',17)} Audio MP3</button>
    </div>
    <div class="m-list">
      ${qs.map(([q,note])=>{
        const size = estSize(v.dur, dlTab, q);
        const did = `d_${v.id}_${dlTab}_${q}`;
        const exists = state.downloads.find(d=>d.id===did);
        return `<div class="m-row">
          <div><span class="m-q">${q}</span>${note?`<span class="m-note">${note}</span>`:''}
            <div class="m-size">${fmtSize(size)} · ${dlTab==='video'?'MP4 · H.264':'MP3 · Audio only'}</div></div>
          <button class="m-dl" onclick="startDownload('${did}','${v.id}','${dlTab}','${q}',${size})">
            ${exists&&exists.status==='done'?ic('check',20):ic('download',20)}</button>
        </div>`; }).join('')}
    </div>`;
}
function startDownload(did, vid, fmt, q, size){
  const exists = state.downloads.find(d=>d.id===did);
  if(exists && exists.status==='done'){ toast('Already downloaded ✔','check',true); return; }
  if(exists && exists.status!=='done'){ toast('Already in download queue','info'); return; }
  const v = byId(vid);
  state.downloads.unshift({ id:did, vid, title:v.t, ch:v.ch, dur:v.dur, fmt, q,
    size, rec:0, sp:1.2+Math.random()*5, status:'downloading', at:Date.now() });
  save('downloads', state.downloads);
  startEngine();
  closeModal();
  toast(`Downloading “${v.t.slice(0,28)}…” (${q})`,'download');
  renderNav();
  if(state.page==='downloads') render();
}
function closeModal(){ $('#modalOv').classList.remove('show'); modalVideo=null; }
 $('#modalOv').addEventListener('click', e=>{ if(e.target.id==='modalOv') closeModal(); });

/* ---------- SEARCH ---------- */
const sInput = $('#searchInput'), sSuggest = $('#suggest');
function doSearch(){
  const q = sInput.value.trim();
  sSuggest.classList.remove('open');
  if(!q) return;
  go('results',{query:q});
}
sInput.addEventListener('input', ()=>{
  const q = sInput.value.trim().toLowerCase();
  if(!q){ sSuggest.classList.remove('open'); return; }
  const hits = [...VIDEOS.filter(v=>v.t.toLowerCase().includes(q)||v.ch.toLowerCase().includes(q)).slice(0,6),
                ...SHORTS.filter(s=>s.t.toLowerCase().includes(q)).slice(0,2)];
  sSuggest.innerHTML = hits.length
    ? hits.map(h=>`<div onclick="sInput.value='${esc(h.t).replace(/'/g,"\\'")}';doSearch()">${ic('search',16)}<span>${esc(h.t)}</span></div>`).join('')
    : `<div>${ic('search',16)}<span>Search “${esc(q)}”</span></div>`;
  sSuggest.classList.add('open');
});
sInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
document.addEventListener('click', e=>{ if(!e.target.closest('.search-wrap')) sSuggest.classList.remove('open'); });
 $('#searchBtn').onclick = doSearch;
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==sInput){ e.preventDefault(); sInput.focus(); }
  if(e.key==='Escape'){ closeModal(); sSuggest.classList.remove('open'); }
});

/* ---------- THEME / HEADER ---------- */
function applyTheme(){
  document.body.classList.toggle('light', state.theme==='light');
  $('#themeBtn').innerHTML = ic(state.theme==='light'?'moon':'sun',20);
  $('#logoMark').innerHTML = icFill('play',16);
  $('#hamburger').innerHTML = ic('menu',22);
  $('#searchBtn').innerHTML = ic('search',19);
}
 $('#themeBtn').onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; save('theme',state.theme); applyTheme(); };
 $('#hamburger').onclick = ()=>{ $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show'); };
 $('#overlay').onclick = ()=>{ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); };

/* ---------- RENDER ROOT ---------- */
function render(){
  const pages = { home:renderHome, trending:renderTrending, results:renderResults,
    downloads:renderDownloads, history:renderHistory, liked:renderLiked, watch:renderWatch };
  $('#main').innerHTML = (pages[state.page]||renderHome)();
  if(state.page==='watch') setupPlayer();
  renderNav();
}
applyTheme();
render();
loadSupabaseVideos();
</script>
