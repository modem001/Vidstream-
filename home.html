<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidStream — Home</title>
<style>
/* ================= THEME ================= */
:root{
  --bg:#0d0d0d; --bg2:#161616; --bg3:#222; --text:#f1f1f1; --text2:#a5a5a5;
  --border:#262626; --chip:#202020; --hover:#2a2a2a;
  --pink:#f4256d; --pink2:#ff5c9d;
  --shadow:0 14px 40px rgba(0,0,0,.5);
}
body.light{
  --bg:#f9f9f9; --bg2:#fff; --bg3:#eee; --text:#0f0f0f; --text2:#5f5f5f;
  --border:#e2e2e2; --chip:#ececec; --hover:#e0e0e0;
  --shadow:0 14px 40px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:var(--hover) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--hover);border-radius:8px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
svg{display:block}

/* ================= HEADER ================= */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:0 16px;height:60px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;transition:background .2s}
.icon-btn:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer;user-select:none;flex-shrink:0}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(244,37,109,.45))}
.logo b{background:linear-gradient(90deg,var(--pink2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-weight:300;color:var(--text)}
.search-wrap{flex:1;max-width:600px;margin:0 auto;position:relative}
.search-bar{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:border .2s}
.search-bar:focus-within{border-color:var(--pink)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);padding:10px 18px;font-size:15px;font-family:inherit;min-width:0}
.search-bar .s-btn{padding:9px 18px;border-left:1px solid var(--border);color:var(--text2)}
.suggest{position:absolute;top:110%;left:0;right:0;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:70}
.suggest.open{display:block}
.suggest div{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;color:var(--text2);font-size:14px}
.suggest div:hover{background:var(--hover);color:var(--text)}

/* ================= LAYOUT ================= */
.layout{display:flex}
.sidebar{width:230px;position:sticky;top:60px;height:calc(100vh - 60px);padding:12px 10px;overflow-y:auto;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:16px;padding:11px 16px;border-radius:12px;cursor:pointer;font-size:14.5px;transition:background .15s;margin-bottom:2px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--bg3);font-weight:700}
.nav-item.active svg{color:var(--pink)}
.nav-sep{border-top:1px solid var(--border);margin:10px 6px}
main{flex:1;min-width:0;padding:18px 22px 90px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none}
.overlay.show{display:block}

/* ================= CHIPS ================= */
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:10px;background:var(--chip);font-size:13.5px;white-space:nowrap;font-weight:500;transition:all .15s}
.chip:hover{background:var(--hover)}
.chip.active{background:var(--text);color:var(--bg);font-weight:700}

/* ================= SHELF TITLES ================= */
.shelf-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:8px 0 14px}
.shelf-title svg{color:var(--pink)}

/* ================= SHORTS ================= */
.shorts-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.shorts-row::-webkit-scrollbar{display:none}
.short-card{flex:0 0 165px;cursor:pointer}
.short-thumb{position:relative;aspect-ratio:9/14;border-radius:16px;overflow:hidden;background:var(--bg3)}
.short-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.short-card:hover .short-thumb img{transform:scale(1.06)}
.short-play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 45%,rgba(0,0,0,.75))}
.short-play svg{color:#fff;opacity:.9}
.short-title{font-size:13.5px;font-weight:600;margin-top:9px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.short-views{font-size:12px;color:var(--text2);margin-top:3px}

/* ================= VIDEO GRID ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 18px}
.card{cursor:pointer;animation:rise .4s ease both}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.card:hover .thumb img{transform:scale(1.05)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg3)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}
.quick-dl{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.72);
  color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(-6px);transition:all .25s}
.quick-dl:hover{background:var(--pink)}
.card:hover .quick-dl{opacity:1;transform:translateY(0)}
.card-info{display:flex;gap:12px;padding:12px 4px 0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,hsl(var(--h,330) 70% 50%),hsl(calc(var(--h,330) + 40) 70% 42%))}
.card-title{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.card-sub{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.verified{color:var(--text2)}
.empty{text-align:center;padding:70px 20px;color:var(--text2)}
.empty h3{color:var(--text);font-size:19px;margin:14px 0 8px}

/* ================= VIDEO MODAL ================= */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:100;display:none;place-items:center;padding:18px}
.modal-ov.show{display:grid}
.pm-box{width:min(860px,100%);background:var(--bg2);border-radius:18px;overflow:hidden;border:1px solid var(--border);
  animation:pop .3s cubic-bezier(.2,1.2,.4,1) both;max-height:92vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.94) translateY(14px);opacity:0}}
.pm-box video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.pm-info{padding:16px 18px 18px}
.pm-title{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:12px}
.pm-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pm-ch{display:flex;align-items:center;gap:10px;margin-right:auto}
.pm-ch .avatar{width:40px;height:40px}
.pm-cname{font-weight:600;font-size:14px}
.pm-csubs{font-size:12px;color:var(--text2)}
.pill{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:22px;background:var(--chip);font-size:13.5px;font-weight:600;transition:background .15s}
.pill:hover{background:var(--hover)}
.pill.liked{background:var(--pink);color:#fff}
.pm-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;z-index:2}
.pm-wrap{position:relative}

/* ================= SHORTS OVERLAY ================= */
.shorts-ov{position:fixed;inset:0;background:#000;z-index:120;display:none;justify-content:center;align-items:center}
.shorts-ov.show{display:flex}
.shorts-stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#111;overflow:hidden}
.shorts-stage video{width:100%;height:100%;object-fit:cover}
.so-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px;z-index:3;
  background:linear-gradient(rgba(0,0,0,.55),transparent)}
.so-title{color:#fff;font-size:14.5px;font-weight:600;flex:1;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.so-close{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.so-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.7));
  color:#fff;font-size:13px;display:flex;align-items:center;gap:8px}
.so-hint{position:absolute;bottom:18px;color:rgba(255,255,255,.65);font-size:12px;z-index:3}

/* ================= TOASTS ================= */
.toasts{position:fixed;bottom:90px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:12px 17px;box-shadow:var(--shadow);font-size:14px;font-weight:500;max-width:320px;
  animation:tin .35s cubic-bezier(.2,1.2,.4,1) both}
.toast svg{color:var(--pink);flex-shrink:0}
.toast.ok svg{color:#2ed573}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.toast.out{animation:tout .3s ease both}
@keyframes tout{to{transform:translateX(40px);opacity:0}}

/* ================= BOTTOM NAV ================= */
.bottom-nav{display:none}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:60px;z-index:56;background:var(--bg);transform:translateX(-100%);
    transition:transform .25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  main{padding:14px 12px 96px}
  .logo span{display:none}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg2);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav .nav-item{flex:1;flex-direction:column;gap:4px;align-items:center;font-size:10.5px;
    padding:7px 2px;border-radius:12px;color:var(--text2)}
  .bottom-nav .nav-item.active{color:var(--text);background:none}
  .bottom-nav .nav-item.active svg{color:var(--pink)}
  .toasts{bottom:110px}
}
@media(max-width:560px){
  .pm-box{border-radius:0;min-height:100vh}
  .shorts-stage{width:100%;aspect-ratio:auto}
}
</style>
</head>
<body>

<div class="overlay" id="drawerOverlay"></div>

<!-- ================= HEADER ================= -->
<header>
  <button class="icon-btn" id="hamburger"></button>
  <div class="logo" onclick="resetHome()">
    <svg viewBox="0 0 120 120"><defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff5c9d"/><stop offset="55%" stop-color="#f4256d"/><stop offset="100%" stop-color="#d40f6a"/>
      </linearGradient></defs>
      <rect x="4" y="4" width="112" height="112" rx="32" fill="url(#lg)"/>
      <path d="M49 39 L85 60 L49 81 Z" fill="#fff"/>
    </svg>
    <span><b>Vid</b><span>Stream</span></span>
  </div>
  <div class="search-wrap">
    <div class="search-bar">
      <input id="searchInput" placeholder="Search videos, channels…" autocomplete="off">
      <button class="s-btn" id="searchBtn"></button>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>
</header>

<!-- ================= LAYOUT ================= -->
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="chips" id="chips"></div>
    <div id="content"></div>
  </main>
</div>

<!-- ================= BOTTOM NAV ================= -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- ================= VIDEO MODAL ================= -->
<div class="modal-ov" id="videoModal">
  <div class="pm-box">
    <div class="pm-wrap">
      <button class="pm-close" onclick="closeVideo()" id="pmClose"></button>
      <video id="pmVideo" controls playsinline></video>
    </div>
    <div class="pm-info">
      <div class="pm-title" id="pmTitle"></div>
      <div class="pm-row">
        <div class="pm-ch">
          <div class="avatar" id="pmAvatar"></div>
          <div><div class="pm-cname" id="pmCh"></div><div class="pm-csubs" id="pmSubs"></div></div>
        </div>
        <button class="pill" id="pmLike"></button>
        <button class="pill" id="pmShare"></button>
        <button class="pill" id="pmDownload" style="background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff"></button>
      </div>
    </div>
  </div>
</div>

<!-- ================= SHORTS OVERLAY ================= -->
<div class="shorts-ov" id="shortsOv">
  <div class="shorts-stage" id="shortsStage">
    <div class="so-top">
      <div class="so-title" id="soTitle"></div>
      <button class="so-close" onclick="closeShort()" id="soClose"></button>
    </div>
    <video id="soVideo" loop playsinline></video>
    <div class="so-bottom"><span id="soCh"></span></div>
    <div class="so-hint">Swipe ↑ / ↓ don canza Short</div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script>
/* ================================================
   VIDSTREAM — HOME (komai a ciki ɗaya)
================================================ */

/* -------- Flow guard: idan bai ga welcome ba, kai shi -------- */
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('vs_'+k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('vs_'+k,JSON.stringify(v))}catch{}};
if(!load('welcomed',false)){ window.location.replace('../welcome.html'); }

/* -------- ICONS -------- */
const PATHS={
  menu:'M3 6h18M3 12h18M3 18h18',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.35-4.35',
  home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  flame:'M12 2s5 4.6 5 9.6a5 5 0 0 1-10 0c0-2.1 1-3.7 2.1-5.3.4 1.9 1.4 3 2.9 3.6C11 8 10.4 5 12 2z',
  download:'M12 3v11M7 10l5 5 5-5M4 20h16',
  history:'M12 3a9 9 0 1 0 9 9M12 7v5l3.5 2M21 3v5h-5',
  heart:'M12 21s-8-5.3-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.7-8 11-8 11z',
  like:'M7 22V11l4.2-9c1.4 0 2.6 1.2 2.6 2.6L13 9h5.8c1.2 0 2.1 1.1 1.9 2.3l-1.3 8A2 2 0 0 1 17.4 21zM7 22H3.5V11H7',
  share:'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M12 3v12M7 8l5-5 5 5',
  play:'M8 5.5v13l11-6.5z',
  playC:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM10 8l6 4-6 4z',
  close:'M18 6 6 18M6 6l12 12',
  check:'M20 6 9 17l-5-5',
  moon:'M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z',
  sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${PATHS[n]}"/></svg>`;
const icFill=(n,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="${PATHS[n]}"/></svg>`;

/* -------- DATA (free sample videos) -------- */
const B='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/';
const IMG=i=>`https://storage.googleapis.com/gtv-videos-bucket/sample/images/${i}.jpg`;
const VIDEOS=[
 {id:'v1',t:'Big Buck Bunny — Full Open Movie (4K)',ch:'Blender Studio',vf:1,v:48219345,d:'2 years ago',dur:'9:56',cat:'Movies',src:B+'BigBuckBunny.mp4',th:IMG('BigBuckBunny')},
 {id:'v2',t:'Sintel — Award-Winning Fantasy Short Film',ch:'Blender Studio',vf:1,v:21744209,d:'3 years ago',dur:'14:48',cat:'Movies',src:B+'Sintel.mp4',th:IMG('Sintel')},
 {id:'v3',t:'Tears of Steel — Sci-Fi Short + VFX',ch:'Blender Studio',vf:1,v:9321587,d:'1 year ago',dur:'12:14',cat:'Movies',src:B+'TearsOfSteel.mp4',th:IMG('TearsOfSteel')},
 {id:'v4',t:'Elephants Dream — The First Open Movie',ch:'Blender Studio',vf:1,v:12803456,d:'4 years ago',dur:'10:53',cat:'Animation',src:B+'ElephantsDream.mp4',th:IMG('ElephantsDream')},
 {id:'v5',t:'Subaru Outback — Street & Dirt Review',ch:'AutoVerse',vf:1,v:3412765,d:'8 months ago',dur:'9:54',cat:'Autos',src:B+'SubaruOutbackOnStreetAndDirt.mp4',th:IMG('SubaruOutbackOnStreetAndDirt')},
 {id:'v6',t:'Volkswagen GTI Review — Worth It in 2025?',ch:'AutoVerse',vf:1,v:5210983,d:'5 months ago',dur:'9:53',cat:'Autos',src:B+'VolkswagenGTIReview.mp4',th:IMG('VolkswagenGTIReview')},
 {id:'v7',t:'What Car Can You Get for $1,000?',ch:'AutoVerse',vf:1,v:7823451,d:'2 months ago',dur:'9:52',cat:'Autos',src:B+'WhatCarCanYouGetForAGrand.mp4',th:IMG('WhatCarCanYouGetForAGrand')},
 {id:'v8',t:'We Are Going On Bullrun! (Announcement)',ch:'DriveLine',vf:0,v:1204531,d:'3 weeks ago',dur:'0:47',cat:'Autos',src:B+'WeAreGoingOnBullrun.mp4',th:IMG('WeAreGoingOnBullrun')},
 {id:'v9',t:"How Sintel's Dragon Was Animated",ch:'Anim School',vf:1,v:2871049,d:'7 months ago',dur:'14:48',cat:'Education',src:B+'Sintel.mp4',th:IMG('Sintel')},
 {id:'v10',t:'VFX Compositing Masterclass — Tears of Steel',ch:'VFX Academy',vf:1,v:1982455,d:'1 year ago',dur:'12:14',cat:'Tech',src:B+'TearsOfSteel.mp4',th:IMG('TearsOfSteel')},
 {id:'v11',t:"Big Buck Bunny but it's Weirdly Hilarious 😂",ch:'FrameByFrame',vf:0,v:6721890,d:'6 months ago',dur:'9:56',cat:'Comedy',src:B+'BigBuckBunny.mp4',th:IMG('BigBuckBunny')},
 {id:'v12',t:'Elephants Dream — Hidden Meaning Explained',ch:'Reel Decoded',vf:1,v:3490122,d:'10 months ago',dur:'10:53',cat:'Education',src:B+'ElephantsDream.mp4',th:IMG('ElephantsDream')},
];
const SHORTS=[
 {id:'s1',t:'When the render finally finishes 🔥',ch:'FrameByFrame',v:8213456,src:B+'ForBiggerBlazes.mp4',th:IMG('ForBiggerBlazes')},
 {id:'s2',t:'POV: escaping the deadline ⏰',ch:'Reel Decoded',v:4451203,src:B+'ForBiggerEscapes.mp4',th:IMG('ForBiggerEscapes')},
 {id:'s3',t:'Friday deploy energy 😂',ch:'FrameByFrame',v:12903455,src:B+'ForBiggerFun.mp4',th:IMG('ForBiggerFun')},
 {id:'s4',t:'Weekend joyride 🚗💨',ch:'AutoVerse',v:3345012,src:B+'ForBiggerJoyrides.mp4',th:IMG('ForBiggerJoyrides')},
 {id:'s5',t:'Monday meltdown ☕',ch:'LoFi Lab',v:5678231,src:B+'ForBiggerMeltdowns.mp4',th:IMG('ForBiggerMeltdowns')},
];
const CATS=['All','Movies','Animation','Autos','Music','Tech','Education','Comedy','Trending'];

/* -------- STATE -------- */
const state={query:'',category:'All',liked:load('liked',[]),theme:load('theme','dark')};

/* -------- HELPERS -------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':n;
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
function toast(msg,icon='check',ok=false){
  const t=document.createElement('div');
  t.className='toast'+(ok?' ok':'');
  t.innerHTML=ic(icon,19)+`<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);
}
function applyTheme(){
  document.body.classList.toggle('light',state.theme==='light');
  const b=$('#themeBtn'); if(b) b.innerHTML=ic(state.theme==='light'?'moon':'sun',20);
}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save('theme',state.theme);applyTheme();}

/* -------- FILTERED LIST -------- */
function filtered(){
  let list=[...VIDEOS];
  if(state.query){
    const q=state.query.toLowerCase();
    list=list.filter(v=>v.t.toLowerCase().includes(q)||v.ch.toLowerCase().includes(q));
  }
  if(state.category==='Trending')list.sort((a,b)=>b.v-a.v);
  else if(state.category!=='All')list=list.filter(v=>v.cat===state.category);
  return list;
}

/* -------- RENDER CHIPS -------- */
function renderChips(){
  $('#chips').innerHTML=CATS.map(c=>
    `<button class="chip ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('');
}
function setCategory(c){state.category=c;renderChips();renderContent();}
function resetHome(){state.query='';state.category='All';$('#searchInput').value='';renderChips();renderContent();window.scrollTo({top:0});}

/* -------- RENDER CONTENT (shorts + grid) -------- */
function renderContent(){
  const list=filtered();
  let html='';
  if(!state.query){
    html+=`<div class="shelf-title">${icFill('playC',24)} Shorts</div>
    <div class="shorts-row">${SHORTS.map(s=>`
      <div class="short-card" onclick="openShort('${s.id}')">
        <div class="short-thumb"><img src="${s.th}" loading="lazy" alt="">
          <div class="short-play">${icFill('play',34)}</div></div>
        <div class="short-title">${esc(s.t)}</div>
        <div class="short-views">${fmtN(s.v)} views</div>
      </div>`).join('')}</div>`;
  }
  html+=`<div class="shelf-title">${ic('flame',22)} ${state.query?'Results for “'+esc(state.query)+'”':(state.category==='Trending'?'Trending now':'Recommended for you')}</div>`;
  html+=list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`
    :`<div class="empty">${ic('search',54)}<h3>No results found</h3><p>Try another keyword or category.</p></div>`;
  $('#content').innerHTML=html;
}
function cardHTML(v){
  return `<div class="card" onclick="openVideo('${v.id}')">
    <div class="thumb"><img src="${v.th}" loading="lazy" alt="">
      <span class="dur">${v.dur}</span>
      <button class="quick-dl" title="Download" onclick="event.stopPropagation();toast('Downloads page — mataki na 4 ⏳','download')">${ic('download',18)}</button>
    </div>
    <div class="card-info">
      <div class="avatar" style="--h:${hue(v.ch)}">${v.ch[0]}</div>
      <div>
        <div class="card-title">${esc(v.t)}</div>
        <div class="card-sub">${esc(v.ch)} ${v.vf?`<span class="verified">${icFill('check',12)}</span>`:''}</div>
        <div class="card-sub">${fmtN(v.v)} views · ${v.d}</div>
      </div>
    </div></div>`;
}

/* -------- SIDEBAR + BOTTOM NAV -------- */
function renderNav(){
  const items=[
    ['home','Home','home',true],['trending','Trending','flame'],
    ['downloads','Downloads','download'],['sep'],
    ['history','History','history'],['liked','Liked videos','heart'],['theme','Theme','gear']
  ];
  $('#sidebar').innerHTML=items.map(n=>n[0]==='sep'?'<div class="nav-sep"></div>':
    `<div class="nav-item ${n[3]?'active':''}" data-i="${n[0]}">${ic(n[2],22)}<span>${n[1]}</span></div>`).join('');
  $('#sidebar').querySelectorAll('.nav-item').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.i;
      if(k==='home'){closeDrawer();resetHome();}
      else if(k==='trending'){closeDrawer();setCategory('Trending');window.scrollTo({top:0});}
      else if(k==='theme'){toggleTheme();}
      else{toast('Wannan shafi — nan gaba ⏳','gear');closeDrawer();}
    };
  });
  const bn=[['Home','home',()=>resetHome()],['Trending','flame',()=>{setCategory('Trending');window.scrollTo({top:0});}],
            ['Downloads','download',()=>toast('Downloads — mataki na 4 ⏳','download')],['Library','history',()=>toast('Library — nan gaba ⏳','history')]];
  $('#bottomNav').innerHTML=bn.map(([l,i],idx)=>
    `<div class="nav-item ${idx===0?'active':''}" onclick="bnActions[${idx}]()">${ic(i,22)}<span>${l}</span></div>`).join('');
}
const bnActions=[()=>resetHome(),()=>{setCategory('Trending');window.scrollTo({top:0});},
  ()=>toast('Downloads — mataki na 4 ⏳','download'),()=>toast('Library — nan gaba ⏳','history')];

/* -------- DRAWER -------- */
function openDrawer(){$('#sidebar').classList.add('open');$('#drawerOverlay').classList.add('show');}
function closeDrawer(){$('#sidebar').classList.remove('open');$('#drawerOverlay').classList.remove('show');}
 $('#hamburger').onclick=openDrawer;
 $('#drawerOverlay').onclick=closeDrawer;

/* -------- VIDEO MODAL -------- */
let currentVideo=null;
function openVideo(id){
  const v=VIDEOS.find(x=>x.id===id);if(!v)return;
  currentVideo=v;
  const vid=$('#pmVideo');
  vid.src=v.src;vid.poster=v.th;
  $('#pmTitle').textContent=v.t;
  $('#pmCh').textContent=v.ch+(v.vf?' ✔':'');
  $('#pmSubs').textContent=fmtN(Math.round(v.v/28))+' subscribers';
  const av=$('#pmAvatar');av.style.setProperty('--h',hue(v.ch));av.textContent=v.ch[0];
  drawLike();
  $('#pmShare').innerHTML=ic('share',17)+' Share';
  $('#pmDownload').innerHTML=ic('download',17)+' Download';
  $('#videoModal').classList.add('show');
  vid.play().catch(()=>{});
}
function drawLike(){
  const on=currentVideo&&state.liked.includes(currentVideo.id);
  $('#pmLike').className='pill'+(on?' liked':'');
  $('#pmLike').innerHTML=icFill('like',16)+' '+fmtN(currentVideo?Math.round(currentVideo.v/22)+(on?1:0):0);
}
 $('#pmLike').onclick=()=>{
  if(!currentVideo)return;
  const i=state.liked.indexOf(currentVideo.id);
  if(i>=0){state.liked.splice(i,1);toast('Removed from liked','heart');}
  else{state.liked.push(currentVideo.id);toast('Added to liked videos','heart',true);}
  save('liked',state.liked);drawLike();
};
 $('#pmShare').onclick=()=>{
  const url=location.href.split('#')[0]+'#watch='+(currentVideo?.id||'');
  (navigator.clipboard?.writeText(url)||Promise.reject()).then(
    ()=>toast('Link copied to clipboard','share',true),
    ()=>toast('Share: '+url.slice(0,36)+'…','share'));
};
 $('#pmDownload').onclick=()=>toast('Downloads page — mataki na 4 ⏳','download');
function closeVideo(){$('#videoModal').classList.remove('show');const v=$('#pmVideo');v.pause();v.src='';}
 $('#videoModal').addEventListener('click',e=>{if(e.target.id==='videoModal')closeVideo();});
 $('#pmClose').innerHTML=ic('close',20);
 $('#soClose').innerHTML=ic('close',20);
 $('#searchBtn').innerHTML=ic('search',19);
 $('#hamburger').innerHTML=ic('menu',22);

/* -------- SHORTS OVERLAY -------- */
let shortIdx=0;
function openShort(id){
  shortIdx=Math.max(0,SHORTS.findIndex(s=>s.id===id));
  showShort();
  $('#shortsOv').classList.add('show');
}
function showShort(){
  const s=SHORTS[shortIdx];
  const v=$('#soVideo');
  v.src=s.src;v.poster=s.th;
  $('#soTitle').textContent=s.t;
  $('#soCh').textContent='@'+s.ch.toLowerCase().replace(/\s/g,'')+' · '+fmtN(s.v)+' views';
  v.play().catch(()=>{});
}
function closeShort(){$('#shortsOv').classList.remove('show');const v=$('#soVideo');v.pause();v.src='';}
 $('#soVideo').addEventListener('click',()=>{const v=$('#soVideo');v.paused?v.play():v.pause();});
/* swipe sama/ƙasa don canza short */
let sy=null;
 $('#shortsStage').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
 $('#shortsStage').addEventListener('touchend',e=>{
  if(sy===null)return;
  const dy=e.changedTouches[0].clientY-sy;
  if(dy<-50&&shortIdx<SHORTS.length-1){shortIdx++;showShort();}
  else if(dy>50&&shortIdx>0){shortIdx--;showShort();}
  sy=null;
},{passive:true});

/* -------- SEARCH -------- */
const sInput=$('#searchInput'),sBox=$('#suggest');
function runSearch(){
  state.query=sInput.value.trim();
  sBox.classList.remove('open');
  renderContent();window.scrollTo({top:0});
}
sInput.addEventListener('input',()=>{
  const q=sInput.value.trim().toLowerCase();
  if(!q){sBox.classList.remove('open');return;}
  const hits=VIDEOS.filter(v=>v.t.toLowerCase().includes(q)||v.ch.toLowerCase().includes(q)).slice(0,6);
  sBox.innerHTML=hits.length
    ?hits.map(h=>`<div onclick="pickSuggest('${esc(h.t).replace(/'/g,"\\'")}')">${ic('search',16)}<span>${esc(h.t)}</span></div>`).join('')
    :`<div>${ic('search',16)}<span>Search “${esc(q)}”</span></div>`;
  sBox.classList.add('open');
});
function pickSuggest(t){sInput.value=t;runSearch();}
sInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});
 $('#searchBtn').onclick=runSearch;
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))sBox.classList.remove('open');});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeVideo();closeShort();sBox.classList.remove('open');closeDrawer();}
});

/* -------- INIT -------- */
applyTheme();
renderChips();
renderContent();
renderNav();
</script>
</body>
</html>
