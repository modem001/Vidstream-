<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidStream — Search & Download</title>
    <!-- Tailwind CSS don tsara kyawun shafi -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome don hotunan alamomi (Icons) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .bg-brand-pink { background-color: #f41b75; }
        .text-brand-pink { color: #f41b75; }
        .border-brand-pink { border-color: #f41b75; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-12">

    <!-- Wurin Sama (Header & Search Bar) -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Logo da Suna -->
            <div class="flex items-center gap-3 cursor-pointer">
                <div class="w-10 h-10 bg-brand-pink rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-play text-lg ml-0.5"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight text-gray-950">VidStream</span>
            </div>

            <!-- Akwatin Bincike (Search Input Form) -->
            <form class="w-full md:w-2/3 flex items-center relative" onsubmit="event.preventDefault(); alert('Kodin bincike na YouTube API zai tashi anan...');">
                <input 
                    type="text" 
                    placeholder="Nemo kowane irin bidiyo na duniya..." 
                    class="w-full px-5 py-3 pl-12 bg-gray-100 text-gray-900 rounded-2xl border border-transparent focus:border-brand-pink focus:bg-white focus:ring-2 focus:ring-pink-100 outline-none transition-all duration-200 text-base"
                />
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400 text-lg"></i>
                <button type="submit" class="absolute right-2 bg-brand-pink text-white px-4 py-1.5 rounded-xl font-medium text-sm hover:bg-pink-600 transition-colors">
                    Nemo
                </button>
            </form>
        </div>
    </header>

    <!-- Babban Wuri Na Fina-finai (Main Content Grid) -->
    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <!-- Rukunin Nuna Sakamako -->
        <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-fire text-brand-pink"></i> Sakamakon Bincike / Sabbin Bidiyoyi
        </h2>

        <!-- Fara Grid din Bidiyoyi -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Bidiyo na 1 (Misali) -->
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200">
                <!-- Hoton Fuskar Bidiyo (Thumbnail) -->
                <div class="relative aspect-video bg-gray-200">
                    <img src="https://unsplash.com" alt="Thumbnail" class="w-full h-full object-cover">
                    <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-0.5 rounded font-medium">12:45</span>
                </div>
                <!-- Bayanan Bidiyo -->
                <div class="p-4">
                    <h3 class="font-bold text-gray-900 line-clamp-2 mb-1 text-base leading-snug">
                        Fassarar Indiya Ta Karshe Kyauta - Sabon Fim Na Nishadi 2026
                    </h3>
                    <p class="text-xs text-gray-500 mb-4 font-medium">Sultan Film Factory • Auduga 100k</p>
                    
                    <!-- Maballan Kallo da Saukewa (Action Buttons) -->
                    <div class="grid grid-cols-2 gap-2">
                        <button class="flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors">
                            <i class="fa-solid fa-eye"></i> Kallo
                        </button>
                        <!-- Maballin Download Direct -->
                        <button onclick="alert('Kodin yt-dlp/Vercel zai sauke wannan bidiyon zuwa wayarka kai tsaye...')" class="flex items-center justify-center gap-2 bg-brand-pink hover:bg-pink-600 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors shadow-sm shadow-pink-100">
                            <i class="fa-solid fa-arrow-down"></i> Download
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bidiyo na 2 (Misali) -->
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200">
                <div class="relative aspect-video bg-gray-200">
                    <img src="https://unsplash.com" alt="Thumbnail" class="w-full h-full object-cover">
                    <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-0.5 rounded font-medium">42:10</span>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900 line-clamp-2 mb-1 text-base leading-snug">
                        Hausa Series Kashi na 15 - Shirin Da Kowa Ke Jira Cikin Wannan Satin
                    </h3>
                    <p class="text-xs text-gray-500 mb-4 font-medium">Arewa Cinema • Auduga 450k</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors">
                            <i class="fa-solid fa-eye"></i> Kallo
                        </button>
                        <button class="flex items-center justify-center gap-2 bg-brand-pink hover:bg-pink-600 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors shadow-sm shadow-pink-100">
                            <i class="fa-solid fa-arrow-down"></i> Download
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
